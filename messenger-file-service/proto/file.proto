syntax = "proto3";

package file;

option go_package = "github.com/MrEsbens/messenger-file-service/api/file/v1;filev1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service FileService {
  rpc GetUploadURL (GetUploadURLRequest) returns (GetUploadURLResponse);
  rpc ConfirmUpload (ConfirmUploadRequest) returns (google.protobuf.Empty);
  rpc GetDownloadURL (GetDownloadURLRequest) returns (GetDownloadURLResponse);
  rpc DeleteFile (DeleteFileRequest) returns (google.protobuf.Empty);
  rpc GetFileByOwner (GetFileByOwnerRequest) returns (GetFileByOwnerResponse);
  rpc GetFilesByOwner (GetFilesByOwnerRequest) returns (GetFilesByOwnerResponse);
}

message GetUploadURLRequest {
  string owner_id = 1;
  string owner_type = 2;
  string bucket_type = 3;
  string file_name = 4;
  string mime_type = 5;
  int64 file_size = 6;
}

message GetUploadURLResponse {
  string file_id = 1;
  string upload_url = 2;
  string object_key = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message ConfirmUploadRequest {
  string file_id = 1;
}

message GetDownloadURLRequest {
  string file_id = 1;
  int64 expiry_seconds = 2;
}

message GetDownloadURLResponse {
  string download_url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message DeleteFileRequest {
  string file_id = 1;
  string owner_id = 2;
}

message GetFileByOwnerRequest {
  string owner_id = 1;
  string owner_type = 2;
  string bucket_type = 3;
}

message GetFileByOwnerResponse {
  string file_id = 1;
  string object_key = 2;
  string public_url = 3;
  string mime_type = 4;
  int64 file_size = 5;
  string file_name = 6;
}

message FileInfo {
  string file_id = 1;
  string object_key = 2;
  string public_url = 3;
  string mime_type = 4;
  int64 file_size = 5;
  string file_name = 6;
}

message GetFilesByOwnerRequest {
  string owner_id = 1;
  string owner_type = 2;
  string bucket_type = 3;
}

message GetFilesByOwnerResponse {
  repeated FileInfo files = 1;
}